<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'"
    />
    <title>WebApplet</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="lists.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>WebApplet</h1>
          <p>サイトを登録して、リボンから開けます。</p>
        </div>
      </header>
      <p id="message" role="status" aria-live="polite"></p>
      <section aria-labelledby="sites-title">
        <h2 id="sites-title">登録サイト</h2>
        <div id="sites"></div>
      </section>
      <section aria-labelledby="accounts-title">
        <header>
          <h2 id="accounts-title">Webアカウント</h2>
          <button id="add-account">アカウントを追加</button>
        </header>
        <p>同じ枠を選んだサイトはログイン状態を共有します。</p>
        <div id="accounts"></div>
      </section>
      <section aria-labelledby="shortcuts-title">
        <header>
          <h2 id="shortcuts-title">新しいサイトの初期ショートカット</h2>
        </header>
        <p>今後追加するサイトへ適用します。既存の割り当ては変更しません。</p>
        <div id="shortcuts"></div>
      </section>
    </main>
    <dialog id="editor">
      <form id="site-form">
        <h2 id="dialog-title">サイトを追加</h2>
        <label>名前<input name="name" maxlength="80" required /></label>
        <label
          >開始URL<input
            name="url"
            type="url"
            required
            placeholder="https://example.com/"
        /></label>
        <div class="actions">
          <button id="discover" type="button">Web側の推奨設定を取得</button
          ><span id="discovery-message" role="status"></span>
        </div>
        <label
          >表示先<select name="display">
            <option value="page">本体ページ</option>
            <option value="window">別ウィンドウ</option>
          </select></label
        >
        <label
          >ページ遷移<select name="navigation">
            <option value="same-origin">同じorigin内だけ</option>
            <option value="none">開始ページに固定</option>
            <option value="any">HTTP(S)のページを許可</option>
          </select></label
        >
        <label
          >追加の許可先<textarea
            name="allowedOrigins"
            rows="3"
            placeholder="https://login.example.com"
          ></textarea>
        </label>
        <label>Webアカウント<select name="accountId" required></select></label>
        <div><strong>アイコン</strong>
          <button id="icon" type="button">ライブラリーから選択</button>
          <button id="icon-clear" type="button">登録画像を外す</button>
          <img id="icon-preview" width="32" height="32" alt="" />
        </div>
        <p id="form-error" role="alert"></p>
        <footer>
          <button id="cancel" type="button">キャンセル</button
          ><button id="save" type="submit">OK</button>
        </footer>
      </form>
    </dialog>
    <dialog id="shortcut-editor">
      <form id="shortcut-form">
        <h2 id="shortcut-title">割り当てを編集</h2>
        <label
          >操作<select name="command">
            <option value="reload">再読み込み</option>
            <option value="back">戻る</option>
            <option value="forward">進む</option>
            <option value="open">開く</option>
            <option value="home">開始ページ</option>
          </select></label
        >
        <label>キー<input name="key" required placeholder="Ctrl+F5" /></label>
        <label
          >条件<select name="scope">
            <option value="owner">このページ</option>
            <option value="pages">すべてのページ</option>
            <option value="app">AppDock全体</option>
            <option value="global">グローバル</option>
            <option value="applets">指定したページ</option>
          </select></label
        >
        <label
          >対象ページのID（1行に1つ）<textarea
            name="appletIds"
            rows="3"
          ></textarea>
        </label>
        <label><input name="enabled" type="checkbox" />有効</label>
        <p id="shortcut-error" role="alert"></p>
        <footer>
          <button type="button" id="shortcut-cancel">キャンセル</button
          ><button type="submit" id="shortcut-save">OK</button>
        </footer>
      </form>
    </dialog>
    <dialog id="order-editor">
      <h2>表示順の並べ替え</h2>
      <ol id="order-list"></ol>
      <p id="order-error" role="alert"></p>
      <footer>
        <button id="order-cancel">キャンセル</button
        ><button id="order-save">OK</button>
      </footer>
    </dialog>
    <dialog id="delete-editor">
      <h2>サイトを削除</h2>
      <p id="delete-message"></p>
      <p id="delete-error" role="alert"></p>
      <footer>
        <button id="delete-cancel">キャンセル</button
        ><button id="delete-save">削除</button>
      </footer>
    </dialog>
    <script src="lists.js"></script>
    <script src="app.js"></script>
  </body>
</html>
